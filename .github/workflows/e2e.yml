name: E2E Tests

on:
  workflow_dispatch:

env:
  FRONTEND_PORT: 5175

jobs:
  smoke:
    name: Smoke (Chromium)
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Pull y build del frontend
        shell: pwsh
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          if (-not (Test-Path $env:FRONTEND_PATH)) {
            throw "No se encontró el frontend en: $env:FRONTEND_PATH"
          }

          Write-Host "Actualizando frontend en $env:FRONTEND_PATH..." -ForegroundColor Cyan
          Set-Location $env:FRONTEND_PATH

          git pull origin develop

          Write-Host "Instalando dependencias..." -ForegroundColor Cyan
          npm ci

          Write-Host "Construyendo..." -ForegroundColor Cyan
          npm run build
          $global:LASTEXITCODE = 0

          Write-Host "Frontend listo" -ForegroundColor Green

      - name: Limpiar puerto si está ocupado
        shell: pwsh
        run: |
          $up = Test-NetConnection 127.0.0.1 -Port $env:FRONTEND_PORT `
            -WarningAction SilentlyContinue -InformationLevel Quiet
          if ($up) {
            Write-Host "Puerto $env:FRONTEND_PORT ocupado, liberando..." -ForegroundColor Yellow
            Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort $env:FRONTEND_PORT `
              -ErrorAction SilentlyContinue |
              ForEach-Object {
                Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue
              }
            Start-Sleep -Seconds 2
          }

      - name: Levantar servidor del frontend
        shell: pwsh
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          $pidFile = "${{ runner.temp }}\frontend-pid.txt"

          $proc = Start-Process npm.cmd `
            -ArgumentList "run", "preview", "--", "--port", "$env:FRONTEND_PORT", "--host", "127.0.0.1", "--strictPort" `
            -WorkingDirectory $env:FRONTEND_PATH `
            -PassThru -NoNewWindow

          $proc.Id | Out-File $pidFile -Encoding utf8
          Write-Host "Servidor iniciado con PID $($proc.Id)"

          $timeout = 60
          $elapsed = 0
          do {
            Start-Sleep -Seconds 2
            $elapsed += 2
            $up = $false
            try {
              $res = Invoke-WebRequest -Uri "http://127.0.0.1:$env:FRONTEND_PORT" -UseBasicParsing
              $up = $true
            } catch {
              if ($_.Exception.Response) {
                $up = $true
              }
            }
          } while (-not $up -and $elapsed -lt $timeout)

          if (-not $up) {
            throw "El servidor no respondió HTTP en $timeout segundos"
          }

          Write-Host "Servidor listo en http://127.0.0.1:$env:FRONTEND_PORT" -ForegroundColor Green

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npx playwright install chromium

      - name: Run smoke
        shell: pwsh
        env:
          CI: true
          PLAYWRIGHT_REUSE_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://${{ secrets.PLAYWRIGHT_TENANT_RUC }}.localhost:${{ env.FRONTEND_PORT }}
          PLAYWRIGHT_TENANT_RUC: ${{ secrets.PLAYWRIGHT_TENANT_RUC }}
          PLAYWRIGHT_LOGIN_EMAIL: ${{ secrets.PLAYWRIGHT_LOGIN_EMAIL }}
          PLAYWRIGHT_LOGIN_PASSWORD: ${{ secrets.PLAYWRIGHT_LOGIN_PASSWORD }}
          PLAYWRIGHT_CHEF_URL: ${{ secrets.PLAYWRIGHT_CHEF_URL }}
          PLAYWRIGHT_CHEF_RUC: ${{ secrets.PLAYWRIGHT_CHEF_RUC }}
          PLAYWRIGHT_CHEF_EMAIL: ${{ secrets.PLAYWRIGHT_CHEF_EMAIL }}
          PLAYWRIGHT_CHEF_PASSWORD: ${{ secrets.PLAYWRIGHT_CHEF_PASSWORD }}
        run: npx playwright test --project=chromium --grep "@smoke"

      - name: Apagar servidor del frontend
        if: always()
        shell: pwsh
        run: |
          $pidFile = "${{ runner.temp }}\frontend-pid.txt"
          if (Test-Path $pidFile) {
            $serverPid = Get-Content $pidFile -ErrorAction SilentlyContinue
            if ($serverPid) {
              Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue
              Write-Host "Servidor (PID $serverPid) detenido"
            }
            Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-smoke-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

