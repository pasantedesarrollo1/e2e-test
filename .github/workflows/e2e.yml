name: E2E Tests

on:
  workflow_dispatch:

env:
  FRONTEND_PORT: 5175

jobs:
  smoke:
    name: Smoke
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Preparar y compilar frontend en develop
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          if (-not (Test-Path $env:FRONTEND_PATH)) { throw "No se encontró el frontend en: $env:FRONTEND_PATH" }
          Set-Location $env:FRONTEND_PATH

          Write-Host "1. Guardando estado local del desarrollador..." -ForegroundColor Yellow
          $CurrentBranch = git rev-parse --abbrev-ref HEAD
          
          $HasChanges = $(git status --porcelain)
          $StashCreated = "false"
          if ($HasChanges) {
            git stash push -u -m "stash-e2e-runner"
            $StashCreated = "true"
          }
          Set-Content -Path ".e2e-original-branch.txt" -Value "$CurrentBranch|$StashCreated"

          Write-Host "2. Cambiando obligatoriamente a develop..." -ForegroundColor Cyan
          git fetch origin
          git checkout --force develop
          git reset --hard origin/develop
          git clean -fd

          Write-Host "3. Instalando dependencias y construyendo..." -ForegroundColor Cyan
          npm ci
          npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
          npm run build
          $Exit = $LASTEXITCODE
          npm config delete script-shell
          if ($Exit -ne 0) { throw "Fallo en la construcción (build)" }

          Write-Host "Frontend listo en develop" -ForegroundColor Green

      - name: Limpiar puerto si está ocupado
        shell: powershell
        run: |
          $up = Test-NetConnection localhost -Port $env:FRONTEND_PORT `
            -WarningAction SilentlyContinue -InformationLevel Quiet
          if ($up) {
            Write-Host "Puerto $env:FRONTEND_PORT ocupado, liberando..." -ForegroundColor Yellow
            Get-NetTCPConnection -LocalPort $env:FRONTEND_PORT `
              -ErrorAction SilentlyContinue |
              ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install chromium

      - name: Levantar Servidor y Ejecutar Smoke
        id: run_smoke
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          CI: true
          PLAYWRIGHT_REUSE_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://${{ secrets.PLAYWRIGHT_TENANT_RUC }}.localhost:${{ env.FRONTEND_PORT }}
          PLAYWRIGHT_TENANT_RUC: ${{ secrets.PLAYWRIGHT_TENANT_RUC }}
          PLAYWRIGHT_RETAIL_EMAIL: ${{ secrets.PLAYWRIGHT_RETAIL_EMAIL }}
          PLAYWRIGHT_RETAIL_PASSWORD: ${{ secrets.PLAYWRIGHT_RETAIL_PASSWORD }}
          PLAYWRIGHT_DISPATCH_EMAIL: ${{ secrets.PLAYWRIGHT_DISPATCH_EMAIL }}
          PLAYWRIGHT_DISPATCH_PASSWORD: ${{ secrets.PLAYWRIGHT_DISPATCH_PASSWORD }}
          PLAYWRIGHT_RESTAURANT_EMAIL: ${{ secrets.PLAYWRIGHT_RESTAURANT_EMAIL }}
          PLAYWRIGHT_RESTAURANT_PASSWORD: ${{ secrets.PLAYWRIGHT_RESTAURANT_PASSWORD }}
          PLAYWRIGHT_CHEF_URL: ${{ secrets.PLAYWRIGHT_CHEF_URL }}
          PLAYWRIGHT_CHEF_RUC: ${{ secrets.PLAYWRIGHT_CHEF_RUC }}
          PLAYWRIGHT_CHEF_EMAIL: ${{ secrets.PLAYWRIGHT_CHEF_EMAIL }}
          PLAYWRIGHT_CHEF_PASSWORD: ${{ secrets.PLAYWRIGHT_CHEF_PASSWORD }}
          PLAYWRIGHT_RESTAURANT_SUBSIDIARY: ${{ secrets.PLAYWRIGHT_RESTAURANT_SUBSIDIARY }}
        run: |
          Write-Host "Iniciando servidor frontend en segundo plano..." -ForegroundColor Cyan
          $proc = Start-Process npm.cmd `
            -ArgumentList "run", "preview", "--", "--port", "$env:FRONTEND_PORT", "--host" `
            -WorkingDirectory $env:FRONTEND_PATH `
            -PassThru -NoNewWindow

          $timeout = 60
          $elapsed = 0
          $up = $false
          do {
            Start-Sleep -Seconds 2
            $elapsed += 2
            try {
              $res = Invoke-WebRequest -Uri "http://localhost:$env:FRONTEND_PORT" -UseBasicParsing
              $up = $true
            } catch {
              if ($_.Exception.Response) { $up = $true }
            }
          } while (-not $up -and $elapsed -lt $timeout)

          if (-not $up) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "El servidor no respondió HTTP en $timeout segundos"
          }
          
          Write-Host "Servidor listo con PID $($proc.Id). Ejecutando Playwright..." -ForegroundColor Green

          npm run test:smoke 2>&1 | Tee-Object -FilePath test-output.log
          $testExitCode = $LASTEXITCODE

          Write-Host "Apagando servidor frontend..." -ForegroundColor Cyan
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Notify Telegram (Smoke)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: Smoke
          scope: "Verificación rápida de funciones principales."
          status: ${{ steps.run_smoke.outcome }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: test-output.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-smoke-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Restaurar entorno local del desarrollador
        if: always()
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          Set-Location $env:FRONTEND_PATH
          if (Test-Path ".e2e-original-branch.txt") {
            $Data = (Get-Content ".e2e-original-branch.txt") -split "\|"
            $OriginalBranch = $Data[0]
            $StashCreated = $Data[1]
            
            Write-Host "Limpiando residuos del build en develop..." -ForegroundColor Yellow
            git reset --hard HEAD
            
            Write-Host "Regresando a tu rama original: $OriginalBranch..." -ForegroundColor Cyan
            git checkout $OriginalBranch
            
            if ($StashCreated -eq "true") {
              Write-Host "Recuperando tus cambios locales..." -ForegroundColor Cyan
              git stash pop
              git stash drop 2>$null
            }
            Remove-Item ".e2e-original-branch.txt"
            Write-Host "Entorno restaurado exitosamente." -ForegroundColor Green
          }

  release:
    name: Release
    runs-on: self-hosted
    needs: smoke
    if: always()
    timeout-minutes: 60

    steps:
      - name: Preparar y compilar frontend en develop
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          if (-not (Test-Path $env:FRONTEND_PATH)) { throw "No se encontró el frontend" }
          Set-Location $env:FRONTEND_PATH

          Write-Host "1. Guardando estado local del desarrollador..." -ForegroundColor Yellow
          $CurrentBranch = git rev-parse --abbrev-ref HEAD
          
          $HasChanges = $(git status --porcelain)
          $StashCreated = "false"
          if ($HasChanges) {
            git stash push -u -m "stash-e2e-runner"
            $StashCreated = "true"
          }
          Set-Content -Path ".e2e-original-branch.txt" -Value "$CurrentBranch|$StashCreated"

          Write-Host "2. Cambiando obligatoriamente a develop..." -ForegroundColor Cyan
          git fetch origin
          git checkout --force develop
          git reset --hard origin/develop
          git clean -fd

          Write-Host "3. Instalando dependencias y construyendo..." -ForegroundColor Cyan
          npm ci
          npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
          npm run build
          $Exit = $LASTEXITCODE
          npm config delete script-shell
          if ($Exit -ne 0) { throw "Fallo en la construcción (build)" }

      - name: Limpiar puerto si está ocupado
        shell: powershell
        run: |
          $up = Test-NetConnection localhost -Port $env:FRONTEND_PORT `
            -WarningAction SilentlyContinue -InformationLevel Quiet
          if ($up) {
            Write-Host "Puerto $env:FRONTEND_PORT ocupado, liberando..." -ForegroundColor Yellow
            Get-NetTCPConnection -LocalPort $env:FRONTEND_PORT `
              -ErrorAction SilentlyContinue |
              ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install chromium

      - name: Levantar Servidor y Ejecutar Release
        id: run_release
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          CI: true
          PLAYWRIGHT_REUSE_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://${{ secrets.PLAYWRIGHT_TENANT_RUC }}.localhost:${{ env.FRONTEND_PORT }}
          PLAYWRIGHT_TENANT_RUC: ${{ secrets.PLAYWRIGHT_TENANT_RUC }}
          PLAYWRIGHT_RETAIL_EMAIL: ${{ secrets.PLAYWRIGHT_RETAIL_EMAIL }}
          PLAYWRIGHT_RETAIL_PASSWORD: ${{ secrets.PLAYWRIGHT_RETAIL_PASSWORD }}
          PLAYWRIGHT_DISPATCH_EMAIL: ${{ secrets.PLAYWRIGHT_DISPATCH_EMAIL }}
          PLAYWRIGHT_DISPATCH_PASSWORD: ${{ secrets.PLAYWRIGHT_DISPATCH_PASSWORD }}
          PLAYWRIGHT_RESTAURANT_EMAIL: ${{ secrets.PLAYWRIGHT_RESTAURANT_EMAIL }}
          PLAYWRIGHT_RESTAURANT_PASSWORD: ${{ secrets.PLAYWRIGHT_RESTAURANT_PASSWORD }}
          PLAYWRIGHT_CHEF_URL: ${{ secrets.PLAYWRIGHT_CHEF_URL }}
          PLAYWRIGHT_CHEF_RUC: ${{ secrets.PLAYWRIGHT_CHEF_RUC }}
          PLAYWRIGHT_CHEF_EMAIL: ${{ secrets.PLAYWRIGHT_CHEF_EMAIL }}
          PLAYWRIGHT_CHEF_PASSWORD: ${{ secrets.PLAYWRIGHT_CHEF_PASSWORD }}
          PLAYWRIGHT_RESTAURANT_SUBSIDIARY: ${{ secrets.PLAYWRIGHT_RESTAURANT_SUBSIDIARY }}
        run: |
          Write-Host "Iniciando servidor frontend en segundo plano..." -ForegroundColor Cyan
          $proc = Start-Process npm.cmd `
            -ArgumentList "run", "preview", "--", "--port", "$env:FRONTEND_PORT", "--host" `
            -WorkingDirectory $env:FRONTEND_PATH `
            -PassThru -NoNewWindow

          $timeout = 60
          $elapsed = 0
          $up = $false
          do {
            Start-Sleep -Seconds 2
            $elapsed += 2
            try {
              $res = Invoke-WebRequest -Uri "http://localhost:$env:FRONTEND_PORT" -UseBasicParsing
              $up = $true
            } catch {
              if ($_.Exception.Response) { $up = $true }
            }
          } while (-not $up -and $elapsed -lt $timeout)

          if (-not $up) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "El servidor no respondió HTTP en $timeout segundos"
          }
          
          Write-Host "Servidor listo con PID $($proc.Id). Ejecutando Playwright..." -ForegroundColor Green

          npm run test:release -- --workers=1 2>&1 | Tee-Object -FilePath test-output.log
          $testExitCode = $LASTEXITCODE

          Write-Host "Apagando servidor frontend..." -ForegroundColor Cyan
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Notify Telegram (Release)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: Release
          scope: "Pruebas completas de release (Happy Path)."
          status: ${{ steps.run_release.outcome }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: test-output.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-release-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Restaurar entorno local del desarrollador
        if: always()
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          Set-Location $env:FRONTEND_PATH
          if (Test-Path ".e2e-original-branch.txt") {
            $Data = (Get-Content ".e2e-original-branch.txt") -split "\|"
            $OriginalBranch = $Data[0]
            $StashCreated = $Data[1]
            
            Write-Host "Limpiando residuos del build en develop..." -ForegroundColor Yellow
            git reset --hard HEAD
            Write-Host "Regresando a tu rama original: $OriginalBranch..." -ForegroundColor Cyan
            git checkout $OriginalBranch
            
            if ($StashCreated -eq "true") {
              Write-Host "Recuperando tus cambios locales..." -ForegroundColor Cyan
              git stash pop
              git stash drop 2>$null
            }
            Remove-Item ".e2e-original-branch.txt"
          }

  regression:
    name: Regression
    runs-on: self-hosted
    needs: release
    if: false
    timeout-minutes: 45

    steps:
      - name: Preparar y compilar frontend en develop
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          if (-not (Test-Path $env:FRONTEND_PATH)) { throw "No se encontró el frontend" }
          Set-Location $env:FRONTEND_PATH
          
          $CurrentBranch = git rev-parse --abbrev-ref HEAD
          $HasChanges = $(git status --porcelain)
          $StashCreated = "false"
          if ($HasChanges) {
            git stash push -u -m "stash-e2e-runner"
            $StashCreated = "true"
          }
          Set-Content -Path ".e2e-original-branch.txt" -Value "$CurrentBranch|$StashCreated"
          
          git fetch origin
          git checkout --force develop
          git reset --hard origin/develop
          git clean -fd
          
          npm ci
          npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
          npm run build
          $Exit = $LASTEXITCODE
          npm config delete script-shell
          if ($Exit -ne 0) { throw "Fallo en la construcción (build)" }

      - name: Limpiar puerto si está ocupado
        shell: powershell
        run: |
          $up = Test-NetConnection localhost -Port $env:FRONTEND_PORT `
            -WarningAction SilentlyContinue -InformationLevel Quiet
          if ($up) {
            Get-NetTCPConnection -LocalPort $env:FRONTEND_PORT -ErrorAction SilentlyContinue |
              ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install chromium

      - name: Levantar Servidor y Ejecutar Regression
        id: run_regression
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          CI: true
          PLAYWRIGHT_REUSE_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://${{ secrets.PLAYWRIGHT_TENANT_RUC }}.localhost:${{ env.FRONTEND_PORT }}
          PLAYWRIGHT_TENANT_RUC: ${{ secrets.PLAYWRIGHT_TENANT_RUC }}
          PLAYWRIGHT_RETAIL_EMAIL: ${{ secrets.PLAYWRIGHT_RETAIL_EMAIL }}
          PLAYWRIGHT_RETAIL_PASSWORD: ${{ secrets.PLAYWRIGHT_RETAIL_PASSWORD }}
          PLAYWRIGHT_DISPATCH_EMAIL: ${{ secrets.PLAYWRIGHT_DISPATCH_EMAIL }}
          PLAYWRIGHT_DISPATCH_PASSWORD: ${{ secrets.PLAYWRIGHT_DISPATCH_PASSWORD }}
          PLAYWRIGHT_RESTAURANT_EMAIL: ${{ secrets.PLAYWRIGHT_RESTAURANT_EMAIL }}
          PLAYWRIGHT_RESTAURANT_PASSWORD: ${{ secrets.PLAYWRIGHT_RESTAURANT_PASSWORD }}
          PLAYWRIGHT_CHEF_URL: ${{ secrets.PLAYWRIGHT_CHEF_URL }}
          PLAYWRIGHT_CHEF_RUC: ${{ secrets.PLAYWRIGHT_CHEF_RUC }}
          PLAYWRIGHT_CHEF_EMAIL: ${{ secrets.PLAYWRIGHT_CHEF_EMAIL }}
          PLAYWRIGHT_CHEF_PASSWORD: ${{ secrets.PLAYWRIGHT_CHEF_PASSWORD }}
          PLAYWRIGHT_RESTAURANT_SUBSIDIARY: ${{ secrets.PLAYWRIGHT_RESTAURANT_SUBSIDIARY }}
        run: |
          $proc = Start-Process npm.cmd `
            -ArgumentList "run", "preview", "--", "--port", "$env:FRONTEND_PORT", "--host" `
            -WorkingDirectory $env:FRONTEND_PATH `
            -PassThru -NoNewWindow

          $timeout = 60
          $elapsed = 0
          $up = $false
          do {
            Start-Sleep -Seconds 2
            $elapsed += 2
            try {
              $res = Invoke-WebRequest -Uri "http://localhost:$env:FRONTEND_PORT" -UseBasicParsing
              $up = $true
            } catch {
              if ($_.Exception.Response) { $up = $true }
            }
          } while (-not $up -and $elapsed -lt $timeout)

          if (-not $up) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "El servidor no respondió HTTP"
          }

          npx playwright test --grep "@regression" 2>&1 | Tee-Object -FilePath test-output.log
          $testExitCode = $LASTEXITCODE

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Notify Telegram (Regression)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: Regression
          scope: "Ejecución profunda de validaciones en módulos completos."
          status: ${{ steps.run_regression.outcome }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: test-output.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-regression-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Restaurar entorno local del desarrollador
        if: always()
        shell: powershell
        env:
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          Set-Location $env:FRONTEND_PATH
          if (Test-Path ".e2e-original-branch.txt") {
            $Data = (Get-Content ".e2e-original-branch.txt") -split "\|"
            $OriginalBranch = $Data[0]
            $StashCreated = $Data[1]
            
            git reset --hard HEAD
            git checkout $OriginalBranch
            
            if ($StashCreated -eq "true") {
              git stash pop
              git stash drop 2>$null
            }
            Remove-Item ".e2e-original-branch.txt"
          }