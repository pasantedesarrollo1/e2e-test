name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke

  push:
    branches:
      - develop

env:
  PLAYWRIGHT_BASE_URL: https://1792780241001.wanqara.org

jobs:
  smoke:
    name: Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Smoke Suite
        id: smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_TENANT_RUC: ${{ secrets.PLAYWRIGHT_TENANT_RUC }}
          PLAYWRIGHT_RETAIL_EMAIL: ${{ secrets.PLAYWRIGHT_RETAIL_EMAIL }}
          PLAYWRIGHT_RETAIL_PASSWORD: ${{ secrets.PLAYWRIGHT_RETAIL_PASSWORD }}
          PLAYWRIGHT_DISPATCH_EMAIL: ${{ secrets.PLAYWRIGHT_DISPATCH_EMAIL }}
          PLAYWRIGHT_DISPATCH_PASSWORD: ${{ secrets.PLAYWRIGHT_DISPATCH_PASSWORD }}
          PLAYWRIGHT_RESTAURANT_EMAIL: ${{ secrets.PLAYWRIGHT_RESTAURANT_EMAIL }}
          PLAYWRIGHT_RESTAURANT_PASSWORD: ${{ secrets.PLAYWRIGHT_RESTAURANT_PASSWORD }}
          PLAYWRIGHT_CHEF_URL: ${{ secrets.PLAYWRIGHT_CHEF_URL }}
          PLAYWRIGHT_CHEF_RUC: ${{ secrets.PLAYWRIGHT_CHEF_RUC }}
          PLAYWRIGHT_CHEF_EMAIL: ${{ secrets.PLAYWRIGHT_CHEF_EMAIL }}
          PLAYWRIGHT_CHEF_PASSWORD: ${{ secrets.PLAYWRIGHT_CHEF_PASSWORD }}
        run: |
          set +e
          npx playwright test --project=Smoke --workers=1 2>&1 | tee test-output.log
          exit "${PIPESTATUS[0]}"

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: Smoke
          scope: "Base rendering check (Admin, Retail, Restaurant)."
          status: ${{ steps.smoke.outcome }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload Smoke report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-smoke-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7