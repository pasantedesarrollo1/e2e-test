              Write-Host "Servidor (PID $serverPid) detenido"
            }
            Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-release-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

