name: Sync Develop E2E (Smoke & Release)

on:
  workflow_dispatch:

env:
  FRONTEND_PORT: 5175
  PLAYWRIGHT_BASE_URL: http://${{ secrets.PLAYWRIGHT_TENANT_RUC }}.localhost:5175
  PLAYWRIGHT_CHEF_URL: ${{ secrets.PLAYWRIGHT_CHEF_URL }}
  PLAYWRIGHT_CHEF_RUC: ${{ secrets.PLAYWRIGHT_CHEF_RUC }}
  PLAYWRIGHT_CHEF_EMAIL: ${{ secrets.PLAYWRIGHT_CHEF_EMAIL }}
  PLAYWRIGHT_CHEF_PASSWORD: ${{ secrets.PLAYWRIGHT_CHEF_PASSWORD }}
  PLAYWRIGHT_TENANT_RUC: ${{ secrets.PLAYWRIGHT_TENANT_RUC }}
  PLAYWRIGHT_RETAIL_EMAIL: ${{ secrets.PLAYWRIGHT_RETAIL_EMAIL }}
  PLAYWRIGHT_RETAIL_PASSWORD: ${{ secrets.PLAYWRIGHT_RETAIL_PASSWORD }}
  PLAYWRIGHT_DISPATCH_EMAIL: ${{ secrets.PLAYWRIGHT_DISPATCH_EMAIL }}
  PLAYWRIGHT_DISPATCH_PASSWORD: ${{ secrets.PLAYWRIGHT_DISPATCH_PASSWORD }}
  PLAYWRIGHT_RESTAURANT_EMAIL: ${{ secrets.PLAYWRIGHT_RESTAURANT_EMAIL }}
  PLAYWRIGHT_RESTAURANT_PASSWORD: ${{ secrets.PLAYWRIGHT_RESTAURANT_PASSWORD }}
  PLAYWRIGHT_RESTAURANT_SUBSIDIARY: ${{ secrets.PLAYWRIGHT_RESTAURANT_SUBSIDIARY }}
  CI: true

jobs:
  run-wanqara-tests:
    name: Ejecutar Smoke y Release de Wanqara
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout E2E Tests
        uses: actions/checkout@v4

      - name: Checkout Frontend App
        uses: actions/checkout@v4
        with:
          repository: Todoneg/wanqara-10-front
          ref: develop
          token: ${{ secrets.FRONTEND_REPO_PAT }}
          path: frontend-app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Frontend
        working-directory: ./frontend-app
        run: |
          npm ci
          npm run build

      - name: Start Frontend Server
        working-directory: ./frontend-app
        run: |
          npm run preview -- --port ${{ env.FRONTEND_PORT }} &
          npx wait-on http://localhost:${{ env.FRONTEND_PORT }} -t 60000

      - name: Install Playwright & Deps
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Smoke Suite
        id: run_smoke
        run: |
          set +e
          npx playwright test --project=Smoke --workers=1 2>&1 | tee test-output-smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Notify Telegram (Smoke)
        if: always() && steps.run_smoke.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: Smoke
          scope: "Verificación rápida de funciones principales."
          status: ${{ steps.run_smoke.outcome }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: test-output-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-smoke-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Run Release Suite
        id: run_release
        if: steps.run_smoke.outcome == 'success'
        run: |
          set +e
          npx playwright test --project=Release --workers=1 2>&1 | tee test-output-release.log
          exit "${PIPESTATUS[0]}"

      - name: Notify Telegram (Release)
        if: always() && steps.run_release.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: Release
          scope: "Pruebas completas de release (Happy Path)."
          status: ${{ steps.run_release.outcome }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: test-output-release.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-release-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7