name: Sync Develop E2E (Smoke & Release)

on:
  workflow_dispatch:

env:
  FRONTEND_PORT: 5175
  PLAYWRIGHT_WANQARA_PORT: 5175
  PLAYWRIGHT_TENANT_RUC: ${{ secrets.PLAYWRIGHT_TENANT_RUC }}
  PLAYWRIGHT_BASE_URL: http://${{ secrets.PLAYWRIGHT_TENANT_RUC }}.localhost:5175

  PLAYWRIGHT_ACTOR_3_EMAIL: ${{ secrets.PLAYWRIGHT_ACTOR_3_EMAIL }}
  PLAYWRIGHT_ACTOR_3_PASSWORD: ${{ secrets.PLAYWRIGHT_ACTOR_3_PASSWORD }}
  PLAYWRIGHT_ACTOR_2_EMAIL: ${{ secrets.PLAYWRIGHT_ACTOR_2_EMAIL }}
  PLAYWRIGHT_ACTOR_2_PASSWORD: ${{ secrets.PLAYWRIGHT_ACTOR_2_PASSWORD }}
  
  PLAYWRIGHT_ACTOR_1_EMAIL: ${{ secrets.PLAYWRIGHT_ACTOR_1_EMAIL }}
  PLAYWRIGHT_ACTOR_1_PASSWORD: ${{ secrets.PLAYWRIGHT_ACTOR_1_PASSWORD }}
  PLAYWRIGHT_SUBSIDIARY: ${{ secrets.PLAYWRIGHT_SUBSIDIARY }}

  PLAYWRIGHT_CHEF_URL: ${{ secrets.PLAYWRIGHT_CHEF_URL }}
  PLAYWRIGHT_CHEF_ACTOR_1_RUC: ${{ secrets.PLAYWRIGHT_CHEF_ACTOR_1_RUC }}
  PLAYWRIGHT_CHEF_ACTOR_1_EMAIL: ${{ secrets.PLAYWRIGHT_CHEF_ACTOR_1_EMAIL }}
  PLAYWRIGHT_CHEF_ACTOR_1_PASSWORD: ${{ secrets.PLAYWRIGHT_CHEF_ACTOR_1_PASSWORD }}
  PLAYWRIGHT_CHEF_ACTOR_1_WORKSTATION_CODE: ${{ secrets.PLAYWRIGHT_CHEF_ACTOR_1_WORKSTATION_CODE }}
  
  PLAYWRIGHT_LOGIN_EMAIL: ${{ secrets.PLAYWRIGHT_LOGIN_EMAIL }}
  PLAYWRIGHT_LOGIN_PASSWORD: ${{ secrets.PLAYWRIGHT_LOGIN_PASSWORD }}
  PLAYWRIGHT_WORKSTATION_CODE: ${{ secrets.PLAYWRIGHT_WORKSTATION_CODE }}

  CI: true

jobs:
  run-wanqara-tests:
    name: Ejecutar Smoke y Release de Wanqara
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout E2E Tests
        uses: actions/checkout@v4

      - name: Checkout Frontend App
        uses: actions/checkout@v4
        with:
          repository: Todoneg/wanqara-10-front
          ref: develop
          token: ${{ secrets.FRONTEND_REPO_PAT }}
          path: frontend-app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Frontend
        working-directory: ./frontend-app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_API_URL: ${{ secrets.PLAYWRIGHT_VITE_API_URL }}
          VITE_HOLIDAY_TAX_ID: ${{ secrets.VITE_HOLIDAY_TAX_ID }}
          VITE_USE_DECIMAL_PRICES: ${{ secrets.VITE_USE_DECIMAL_PRICES }}
        run: |
          npm ci
          npm run build

      - name: Start Frontend Server
        working-directory: ./frontend-app
        run: |
          npm run preview -- --port ${{ env.FRONTEND_PORT }} --host &
          npx wait-on http://localhost:${{ env.FRONTEND_PORT }} -t 60000

      - name: Install Playwright & Deps
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Smoke Suite
        id: run_smoke
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-smoke
        run: |
          set +e
          npx playwright test --project=Smoke --workers=2 2>&1 | tee test-output-smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Notify Telegram (Pipeline Error)
        if: always() && steps.run_smoke.outcome == 'skipped'
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: "Pipeline"
          scope: "Error crítico de infraestructura — los tests no llegaron a ejecutarse."
          status: failure
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify Telegram (Smoke)
        if: always() && steps.run_smoke.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: Smoke
          scope: "Verificación rápida de funciones principales."
          status: ${{ steps.run_smoke.outcome }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: test-output-smoke.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-smoke-${{ github.run_id }}
          path: playwright-report-smoke/
          retention-days: 7

      - name: Run Release Suite
        id: run_release
        if: steps.run_smoke.outcome == 'success'
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-release
        run: |
          set +e
          npx playwright test --project=Release --workers=1 2>&1 | tee test-output-release.log
          exit "${PIPESTATUS[0]}"

      - name: Notify Telegram (Release)
        if: always() && steps.run_release.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/notify-telegram
        with:
          suite: Release
          scope: "Pruebas completas de release (Happy Path)."
          status: ${{ steps.run_release.outcome }}
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          log_file: test-output-release.log

      - uses: actions/upload-artifact@v4
        if: always() && steps.run_release.outcome != 'skipped'
        with:
          name: report-release-${{ github.run_id }}
          path: playwright-report-release/
          retention-days: 7